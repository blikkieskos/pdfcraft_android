[package]
name = "pdfcraft"
version = "0.1.0"
description = "PDFCraft Desktop Application"
authors = ["PDFCraft"]
edition = "2021"

[lib]
name = "pdfcraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop serves the frontend from a loopback server (see run() in src/lib.rs). Android
# keeps Tauri's built-in asset protocol, which already sends the cross-origin headers.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-localhost = "2"
